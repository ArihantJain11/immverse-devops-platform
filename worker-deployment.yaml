apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.tenantId }}-worker
  namespace: {{ .Values.tenantId }}
spec:
  replicas: {{ .Values.worker.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: {{ .Values.tenantId }}-worker
  template:
    metadata:
      labels:
        app: {{ .Values.tenantId }}-worker
    spec:
      terminationGracePeriodSeconds: 70
      containers:
      - name: worker
        image: busybox:1.36
        command: ["/bin/sh", "-c"]
        args:
          - |
            trap 'echo "SIGTERM received. Finishing current 60s job..."; sleep 10; exit 0' SIGTERM SIGINT
            while true; do
              echo "Consuming jobs from Redis..."
              sleep 2
            done
        resources:
          {{- toYaml .Values.worker.resources | nindent 10 }}