tenantId: shared
replicaCount: 4

image:
  repository: hashicorp/http-echo
  tag: "latest"
  pullPolicy: IfNotPresent

api:
  port: 8080
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  hpa:
    minReplicas: 4
    maxReplicas: 55
    targetCPUUtilizationPercentage: 70

worker:
  replicas: 8
  maxReplicas: 40
  targetQueueLength: 25
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

env:
  REDIS_HOST: "redis-master.datastores.svc.cluster.local"
  REDIS_PORT: "6379"
  DATABASE_URL: "postgresql://postgres:devpassword@postgres-postgresql.datastores.svc.cluster.local:5432/app"