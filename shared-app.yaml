apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shared-platform-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/my-org/devops-zero-downtime-platform.git'
    targetRevision: HEAD
    path: gitops/shared-cluster/chart
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: shared
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true