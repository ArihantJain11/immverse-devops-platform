name: CI Artifact Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

jobs:
  build-scan-sign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Container Image
        run: |
          docker build \
            --file Dockerfile.mock \
            --tag ghcr.io/${{ github.repository }}/app:${{ github.sha }} \
            --tag ghcr.io/${{ github.repository }}/app:latest .
          docker save ghcr.io/${{ github.repository }}/app:${{ github.sha }} -o /tmp/image.tar

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          input: /tmp/image.tar
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Push Container Image by Digest
        id: push
        run: |
          docker push ghcr.io/${{ github.repository }}/app:${{ github.sha }}
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/${{ github.repository }}/app:${{ github.sha }} | cut -d'@' -f2)
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT

      - name: Sign Container Image (Keyless OIDC)
        run: |
          cosign sign --yes "ghcr.io/${{ github.repository }}/app@${{ steps.push.outputs.digest }}"